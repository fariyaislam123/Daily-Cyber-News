<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Cyber News</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff3d9a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --black: #000;
  --navy: #081030;
  --surface: #0f1a45;
  --line: #24336b;
  --pink: #ff3d9a;
  --pink-soft: #ffb3d6;
  --text: #e8ecf8;
  --muted: #9aa6cf;
  --critical: #ff4040;
  --high: #ff9f43;
  --medium: #ffd166;
  --low: #4cc9a6;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body {
  margin: 0;
  background: var(--navy);
  color: var(--text);
  font-family: "Bricolage Grotesque", "Hind Siliguri", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

/* header */
header { background: var(--black); border-bottom: 3px solid var(--pink); }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0 14px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1.05; }
#today { color: var(--text); font-weight: 600; }
.art { flex: 0 1 430px; width: 430px; max-width: 100%; height: auto; }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.updated { color: var(--muted); font-size: 13px; }

/* toolbar */
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--navy); border-bottom: 1px solid var(--line); padding: 12px 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 10px; }
input, select, .pill {
  font: inherit; font-size: 14px; color: var(--text);
  background: var(--black); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
}
input { flex: 1 1 200px; min-width: 0; }
input::placeholder { color: var(--muted); }
.pill { cursor: pointer; border-radius: 999px; }
.pill[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--black); font-weight: 600; }

/* severity bar */
.sevbar { display: flex; gap: 4px; width: 100%; }
.seg {
  flex: 1 1 0; min-width: 96px; text-align: left; cursor: pointer; font: inherit; font-size: 13px;
  color: var(--text); background: var(--black); border: 1px solid var(--line);
  border-bottom: 4px solid var(--c); border-radius: 6px; padding: 6px 10px;
  transform-origin: left;
}
.seg b { font-size: 18px; margin-left: 6px; }
.seg[aria-pressed="true"] { outline: 2px solid var(--pink); outline-offset: 1px; }
.seg.Critical { --c: var(--critical); } .seg.High { --c: var(--high); }
.seg.Medium { --c: var(--medium); } .seg.Low { --c: var(--low); }
.sevbar.intro .seg { animation: grow 0.7s ease-out both; }
.sevbar.intro .seg:nth-child(2) { animation-delay: 0.1s; }
.sevbar.intro .seg:nth-child(3) { animation-delay: 0.2s; }
.sevbar.intro .seg:nth-child(4) { animation-delay: 0.3s; }
@keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }

/* feed */
main { padding: 20px 0 60px; }
.day { display: flex; align-items: center; gap: 12px; margin: 28px 0 12px; font-size: 15px; font-weight: 600; color: var(--pink-soft); }
.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pinned { background: var(--black); border: 1px solid var(--pink); border-radius: 12px; padding: 14px 14px 4px; margin-bottom: 8px; }
.pinned h2 { margin: 0; font-size: 18px; }
.pinned p.sub { margin: 2px 0 12px; color: var(--muted); font-size: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--sev, var(--medium));
  border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
}
.card.Critical { --sev: var(--critical); } .card.High { --sev: var(--high); }
.card.Medium { --sev: var(--medium); } .card.Low { --sev: var(--low); }
.card h3 { margin: 6px 0 8px; font-size: 19px; line-height: 1.3; font-weight: 700; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sev { font-size: 13px; font-weight: 700; color: var(--sev); }
.sev::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sev); margin-right: 6px; }
.tag { font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--black); border: 1px solid var(--line); color: var(--muted); }
.tag.bd { border-color: var(--pink); color: var(--pink-soft); }
.card ul { margin: 0; padding: 0; list-style: none; max-width: 75ch; }
.card li { position: relative; padding-left: 16px; margin: 6px 0; font-size: 15px; }
.card li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }
.meta { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.meta strong { color: var(--text); font-weight: 600; }
.note { text-align: center; color: var(--muted); padding: 50px 10px; }
.note strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }

@media (max-width: 560px) {
  h1 { font-size: 34px; } .art { flex-basis: 100%; }
  .seg { min-width: 70px; padding: 6px; }
}
@media (prefers-reduced-motion: reduce) { .sevbar.intro .seg { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <h1>Daily Cyber News</h1>
      <p class="tagline" id="today"></p>
      <p class="tagline">Cyber and tech news for Bangladesh and the world</p>
      <div class="updated" id="updated"></div>
    </div>
    <svg class="art" viewBox="0 0 430 170" role="img" aria-label="Illustration of a robot, a hooded hacker at a laptop, and a malware bug marked with a skull" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#24336b" stroke-width="2">
        <path d="M8 40H60V20H150L170 40H290L310 20H422"/>
        <path d="M8 130H24M150 150H180M290 150H330"/>
        <line x1="8" y1="160" x2="422" y2="160"/>
      </g>
      <g fill="#24336b"><circle cx="60" cy="40" r="3"/><circle cx="150" cy="20" r="3"/><circle cx="290" cy="40" r="3"/></g>

      <g stroke="#fff" stroke-width="3">
        <line x1="75" y1="30" x2="75" y2="16"/><circle cx="75" cy="12" r="4" fill="#fff"/>
        <rect x="26" y="50" width="9" height="22" rx="3" fill="#0f1a45"/>
        <rect x="115" y="50" width="9" height="22" rx="3" fill="#0f1a45"/>
        <rect x="35" y="30" width="80" height="60" rx="14" fill="#0f1a45"/>
        <circle cx="57" cy="56" r="9" fill="#fff"/><circle cx="93" cy="56" r="9" fill="#fff"/>
        <rect x="52" y="72" width="46" height="12" rx="3" fill="#000" stroke-width="2"/>
        <line x1="47" y1="106" x2="30" y2="130" stroke-width="4"/>
        <line x1="103" y1="106" x2="120" y2="130" stroke-width="4"/>
        <rect x="55" y="146" width="12" height="14" rx="2" fill="#0f1a45"/>
        <rect x="83" y="146" width="12" height="14" rx="2" fill="#0f1a45"/>
        <rect x="47" y="96" width="56" height="50" rx="10" fill="#0f1a45"/>
      </g>
      <circle cx="57" cy="56" r="3.5" fill="#000"/><circle cx="93" cy="56" r="3.5" fill="#000"/>
      <path d="M62 75V81M69 75V81M76 75V81M83 75V81M90 75V81" stroke="#fff" stroke-width="2"/>
      <circle cx="75" cy="121" r="7" fill="#fff"/>

      <g stroke="#fff" stroke-width="3">
        <path d="M165 160C165 125 190 112 225 112C260 112 285 125 285 160Z" fill="#0f1a45"/>
        <path d="M178 114C168 28 282 28 272 114Z" fill="#0f1a45"/>
        <ellipse cx="225" cy="76" rx="27" ry="31" fill="#000" stroke-width="2"/>
        <rect x="193" y="126" width="64" height="34" rx="3" fill="#000"/>
      </g>
      <rect x="210" y="70" width="10" height="4" rx="2" fill="#fff"/><rect x="230" y="70" width="10" height="4" rx="2" fill="#fff"/>
      <circle cx="225" cy="143" r="5" fill="#fff"/>

      <g stroke="#fff" stroke-width="3">
        <path d="M348 84L330 76M347 98L328 98M349 112L332 124M392 84L410 76M393 98L412 98M391 112L408 124"/>
        <path d="M364 48L354 34M376 48L386 34"/>
        <circle cx="354" cy="33" r="3" fill="#fff"/><circle cx="386" cy="33" r="3" fill="#fff"/>
        <circle cx="370" cy="56" r="13" fill="#0f1a45"/>
        <ellipse cx="370" cy="100" rx="25" ry="33" fill="#0f1a45"/>
      </g>
      <circle cx="370" cy="95" r="12" fill="#fff"/>
      <circle cx="365" cy="93" r="3" fill="#000"/><circle cx="375" cy="93" r="3" fill="#000"/>
      <rect x="364" y="103" width="12" height="8" rx="2" fill="#fff"/>
      <path d="M368 103V111M372 103V111" stroke="#000" stroke-width="1.5"/>
    </svg>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="row">
      <input id="q" type="search" placeholder="Search headlines and summaries" aria-label="Search">
      <button class="pill" data-region="" aria-pressed="true">All regions</button>
      <button class="pill" data-region="Bangladesh" aria-pressed="false">Bangladesh</button>
      <button class="pill" data-region="Global" aria-pressed="false">Global</button>
    </div>
    <div class="row">
      <select id="category" aria-label="Category">
        <option value="">All categories</option>
        <option>AI</option><option>Vulnerability</option><option>Cyberattack</option>
        <option>Malware/Ransomware</option><option>Data Breach</option>
        <option>Patch Tuesday</option><option>Technology</option>
        <option>Policy</option><option>Other</option>
      </select>
      <select id="days" aria-label="Date range">
        <option value="2">Today and yesterday</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
      <select id="sort" aria-label="Sort order">
        <option value="date">Newest first</option>
        <option value="severity">Highest severity first</option>
      </select>
    </div>
    <div class="row"><div class="sevbar intro" id="sevbar"></div></div>
  </div>
</div>

<main class="wrap" id="list" aria-live="polite"></main>

<script>
const $ = id => document.getElementById(id);
const SEV = ["Critical", "High", "Medium", "Low"];
const TZ = "Asia/Dhaka";
const state = { region: "", severity: "" };
let items = [];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;   // textContent keeps article text from injecting HTML
  if (cls) e.className = cls;
  return e;
}

const dayKey = d => d.toLocaleDateString("en-CA", { timeZone: TZ });
function dayLabel(key) {
  const now = new Date();
  if (key === dayKey(now)) return "Today";
  if (key === dayKey(new Date(now - 864e5))) return "Yesterday";
  return new Date(key + "T12:00:00Z").toLocaleDateString("en-GB",
    { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
const timeOf = iso => new Date(iso).toLocaleTimeString("en-GB",
  { timeZone: TZ, hour: "2-digit", minute: "2-digit" });

function card(a) {
  const sev = SEV.includes(a.severity) ? a.severity : "Medium";
  const c = el("article", "", "card " + sev);
  const tags = el("div", "", "tags");
  tags.append(el("span", sev, "sev"), el("span", a.category || "Other", "tag"));
  if (a.region === "Bangladesh") tags.append(el("span", "Bangladesh", "tag bd"));
  const h = el("h3");
  const link = el("a", a.title);
  link.href = a.url; link.target = "_blank"; link.rel = "noopener";
  h.append(link);
  const ul = el("ul");
  (a.bullets || []).forEach(b => ul.append(el("li", b)));
  const meta = el("p", "", "meta");
  meta.append(el("strong", a.source), el("span", timeOf(a.published_at) + " Dhaka time"));
  c.append(tags, h, ul, meta);
  return c;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const base = items.filter(a =>
    !q || (a.title + " " + (a.bullets || []).join(" ")).toLowerCase().includes(q));

  // severity counts (always reflect the other filters, so the bar stays useful)
  const bar = $("sevbar");
  bar.replaceChildren();
  SEV.forEach(s => {
    const n = base.filter(a => a.severity === s).length;
    const b = el("button", s, "seg " + s);
    b.append(el("b", String(n)));
    b.setAttribute("aria-pressed", state.severity === s);
    b.onclick = () => { state.severity = state.severity === s ? "" : s; render(); };
    bar.append(b);
  });

  const list = base.filter(a => !state.severity || a.severity === state.severity);
  const out = $("list");
  out.replaceChildren();

  if (!list.length) {
    const n = el("div", "", "note");
    n.append(el("strong", "No news matches these filters"),
      el("span", "Try a wider date range, or run python run_all.py to collect fresh articles."));
    out.append(n);
    return;
  }

  // official advisories pinned at the top
  const cirt = list.filter(a => a.source === "BGD e-GOV CIRT").slice(0, 3);
  if (cirt.length) {
    const p = el("section", "", "pinned");
    p.append(el("h2", "BGD e-GOV CIRT advisories"),
      el("p", "Official advisories from Bangladesh’s national CIRT", "sub"));
    cirt.forEach(a => p.append(card(a)));
    out.append(p);
  }
  const rest = list.filter(a => !cirt.includes(a));

  if ($("sort").value === "severity") {
    out.append(el("div", "Highest severity first", "day"));
    rest.forEach(a => out.append(card(a)));
  } else {
    let last = "";
    rest.forEach(a => {
      const k = dayKey(new Date(a.published_at));
      if (k !== last) { out.append(el("div", dayLabel(k), "day")); last = k; }
      out.append(card(a));
    });
  }
}

async function load() {
  const params = new URLSearchParams();
  if (state.region) params.set("region", state.region);
  for (const id of ["category", "days", "sort"]) {
    const v = $(id).value;
    if (v) params.set(id, v);
  }
  const out = $("list");
  out.replaceChildren(el("div", "Loading news…", "note"));
  try {
    const res = await fetch("/api/articles?" + params);
    if (!res.ok) throw new Error("Server returned " + res.status);
    items = await res.json();
    $("updated").textContent = "Updated " + timeOf(new Date().toISOString()) + " Dhaka time";
    render();
  } catch (err) {
    const n = el("div", "", "note");
    n.append(el("strong", "Can’t load the news"),
      el("span", "Check that the server is running (uvicorn main:app --reload), then refresh."));
    out.replaceChildren(n);
  }
}

document.querySelectorAll(".pill").forEach(p => p.onclick = () => {
  document.querySelectorAll(".pill").forEach(x => x.setAttribute("aria-pressed", x === p));
  state.region = p.dataset.region;
  load();
});
["category", "days", "sort"].forEach(id => $(id).addEventListener("change", load));
$("q").addEventListener("input", render);
$("today").textContent = new Date().toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: TZ });
load();
</script>
</body>
</html>
