<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Cyber News</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff3d9a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --black: #050912;
  --navy: #080d18;
  --surface: #0d1625;
  --line: #203247;
  --pink: #35f2c1;
  --pink-soft: #9af9e2;
  --text: #e8f2fc;
  --muted: #8da4b9;
  --critical: #ff5364;
  --high: #ffad5c;
  --medium: #f7d66d;
  --low: #35f2c1;
  --surface-raised: #111f31;
  --glow: rgba(53, 242, 193, .12);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(23, 91, 105, .16), transparent 34rem),
    radial-gradient(ellipse at 92% 12%, rgba(34, 67, 111, .15), transparent 32rem),
    var(--navy);
  color: var(--text);
  font-family: "Bricolage Grotesque", "Hind Siliguri", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  opacity: .16;
  background-image: linear-gradient(rgba(91, 135, 161, .12) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(91, 135, 161, .12) 1px, transparent 1px);
  background-size: 36px 36px;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

/* header */
header {
  background: linear-gradient(115deg, rgba(5, 9, 18, .98), rgba(9, 24, 37, .96));
  border-bottom: 1px solid rgba(53, 242, 193, .55);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
  position: relative;
  overflow: hidden;
}
header::after {
  content: "";
  position: absolute;
  width: 280px; height: 280px;
  right: -70px; top: -170px;
  border: 1px solid rgba(53, 242, 193, .18);
  border-radius: 50%;
  box-shadow: 0 0 0 24px rgba(53, 242, 193, .025), 0 0 0 52px rgba(53, 242, 193, .02);
  pointer-events: none;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0 14px; flex-wrap: wrap; }
h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; }
.brandline { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  display: grid; place-items: center; width: 48px; height: 48px; flex: 0 0 48px;
  border: 1px solid rgba(53, 242, 193, .45); border-radius: 14px;
  color: var(--pink); background: var(--glow);
  box-shadow: 0 0 24px rgba(53, 242, 193, .08), inset 0 0 18px rgba(53, 242, 193, .04);
}
.brand-icon svg { width: 26px; height: 26px; }
#today { color: var(--text); font-weight: 600; }
.art { flex: 0 1 430px; width: 430px; max-width: 100%; height: auto; filter: drop-shadow(0 0 18px rgba(53, 242, 193, .06)); }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
 .updated { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); }
.inline-icon { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; color: var(--pink); }
.pinned { background: linear-gradient(120deg, rgba(13, 38, 45, .9), rgba(5, 9, 18, .95)); border-color: rgba(53, 242, 193, .5); box-shadow: 0 0 24px rgba(53, 242, 193, .04); }
.pinned h2 { display: flex; align-items: center; gap: 8px; }
.note { border: 1px dashed var(--line); border-radius: 14px; background: rgba(13, 22, 37, .55); }
@media (max-width: 560px) {
  .head { padding: 22px 0 18px; }
  .brand-icon { width: 40px; height: 40px; flex-basis: 40px; border-radius: 12px; }
  .brand-icon svg { width: 22px; height: 22px; }
  .art { max-height: 145px; }
  .card { padding: 14px; }
}

/* toolbar */
 .toolbar { position: sticky; top: 0; z-index: 5; background: rgba(8, 13, 24, .92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); padding: 14px 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 10px; }
input, select, .pill {
  font: inherit; font-size: 14px; color: var(--text);
  background: #080f1b; border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px;
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
input { flex: 1 1 240px; min-width: 0; }
input:focus, select:focus { border-color: var(--pink); box-shadow: 0 0 0 3px var(--glow); outline: none; }
input::placeholder { color: var(--muted); }
.pill { cursor: pointer; border-radius: 999px; }
 .pill[aria-pressed="true"] { background: var(--glow); border-color: var(--pink); color: var(--pink); font-weight: 700; box-shadow: inset 0 0 18px rgba(53, 242, 193, .06); } 
.pill:hover, .seg:hover { border-color: var(--pink); }

/* severity bar */
.sevbar { display: flex; gap: 4px; width: 100%; }
.seg {
  flex: 1 1 0; min-width: 96px; text-align: left; cursor: pointer; font: inherit; font-size: 13px;
  color: var(--text); background: var(--black); border: 1px solid var(--line);
  border-bottom: 4px solid var(--c); border-radius: 6px; padding: 6px 10px;
  transform-origin: left;
}
.seg b { font-size: 18px; margin-left: 6px; }
.seg[aria-pressed="true"] { outline: 2px solid var(--pink); outline-offset: 1px; }
.seg.Critical { --c: var(--critical); } .seg.High { --c: var(--high); }
.seg.Medium { --c: var(--medium); } .seg.Low { --c: var(--low); }
.sevbar.intro .seg { animation: grow 0.7s ease-out both; }
.sevbar.intro .seg:nth-child(2) { animation-delay: 0.1s; }
.sevbar.intro .seg:nth-child(3) { animation-delay: 0.2s; }
.sevbar.intro .seg:nth-child(4) { animation-delay: 0.3s; }
@keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }

/* feed */
main { padding: 20px 0 60px; }
 .day { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--pink-soft); }
.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pinned { background: var(--black); border: 1px solid var(--pink); border-radius: 12px; padding: 14px 14px 4px; margin-bottom: 8px; }
.pinned h2 { margin: 0; font-size: 18px; }
.pinned p.sub { margin: 2px 0 12px; color: var(--muted); font-size: 14px; }
.card {
  background: linear-gradient(120deg, rgba(17, 31, 49, .98), rgba(11, 22, 36, .98));
  border: 1px solid var(--line); border-left: 3px solid var(--sev, var(--medium));
  border-radius: 12px; padding: 17px 18px; margin-bottom: 13px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .12);
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.card.Critical { --sev: var(--critical); } .card.High { --sev: var(--high); }
.card.Medium { --sev: var(--medium); } .card.Low { --sev: var(--low); }
 .card h3 { margin: 9px 0 10px; font-size: 19px; line-height: 1.35; font-weight: 700; }
.card:hover { transform: translateY(-2px); border-top-color: rgba(53, 242, 193, .42); border-right-color: rgba(53, 242, 193, .42); box-shadow: 0 12px 30px rgba(0, 0, 0, .22), 0 0 22px rgba(53, 242, 193, .035); }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 3px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sev { font-size: 13px; font-weight: 700; color: var(--sev); }
.sev::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sev); margin-right: 6px; }
 .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(5, 9, 18, .6); border: 1px solid var(--line); color: var(--muted); letter-spacing: .15px; }
.tag.bd { border-color: var(--pink); color: var(--pink-soft); }
.card ul { margin: 0; padding: 0; list-style: none; max-width: 75ch; }
.card li { position: relative; padding-left: 16px; margin: 6px 0; font-size: 15px; }
.card li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }
.meta { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.meta strong { color: var(--text); font-weight: 600; }
.note { text-align: center; color: var(--muted); padding: 50px 10px; }
.note strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }

@media (max-width: 560px) {
  h1 { font-size: 34px; } .art { flex-basis: 100%; }
  .seg { min-width: 70px; padding: 6px; }
}
@media (prefers-reduced-motion: reduce) { .sevbar.intro .seg { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <div class="brandline">
        <span class="brand-icon" aria-hidden="true"><i data-lucide="shield-check"></i></span>
        <h1>Daily Cyber News</h1>
      </div>
      <p class="tagline" id="today"></p>
      <p class="tagline"><i data-lucide="radio-tower" class="inline-icon"></i> Cyber intelligence for Bangladesh and the world</p>
      <div class="updated"><span class="status-dot"></span><span id="updated"></span></div>
    </div>
    <svg class="art" viewBox="0 0 430 190" role="img" aria-label="Cybersecurity illustration with a glowing shield, command terminal, and stylized malware threat" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="shieldFill" x1="90" y1="25" x2="180" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35f2c1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#35f2c1" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="220" y1="45" x2="400" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13283a"/>
      <stop offset="1" stop-color="#0a1421"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#244156" stroke-width="1.2" opacity=".8">
    <path d="M4 34H45L57 22H91M4 157H57L70 170H120M310 20H350L362 32H426M338 171H382L394 159H426"/>
    <path d="M20 72H42M388 91H416M28 111H54M366 128H405"/>
    <circle cx="45" cy="34" r="2.5" fill="#35f2c1"/><circle cx="57" cy="157" r="2.5" fill="#35f2c1"/>
    <circle cx="362" cy="32" r="2.5" fill="#35f2c1"/><circle cx="394" cy="159" r="2.5" fill="#35f2c1"/>
  </g>

  <!-- Central security shield -->
  <g filter="url(#softGlow)">
    <path d="M119 20L173 40V81C173 116 151 140 119 157C87 140 65 116 65 81V40L119 20Z" fill="url(#shieldFill)" stroke="#35f2c1" stroke-width="2.2"/>
    <path d="M119 31L162 47V81C162 109 145 129 119 144C93 129 76 109 76 81V47L119 31Z" stroke="#35f2c1" stroke-opacity=".38" stroke-width="1"/>
    <path d="M99 85L113 99L141 68" stroke="#9af9e2" stroke-width="5"/>
  </g>
  <path d="M119 8V18M119 158V171M57 82H66M173 82H183" stroke="#35f2c1" stroke-width="1.5" opacity=".85"/>
  <circle cx="119" cy="8" r="2.5" fill="#35f2c1"/><circle cx="119" cy="171" r="2.5" fill="#35f2c1"/>

  <!-- Threat monitoring terminal -->
  <g>
    <rect x="208" y="37" width="173" height="111" rx="10" fill="url(#panelFill)" stroke="#35536a" stroke-width="1.4"/>
    <path d="M208 60H381" stroke="#35536a" stroke-width="1.2"/>
    <circle cx="223" cy="49" r="3" fill="#ff5364"/>
    <circle cx="234" cy="49" r="3" fill="#ffad5c"/>
    <circle cx="245" cy="49" r="3" fill="#35f2c1"/>
    <rect x="222" y="72" width="55" height="6" rx="3" fill="#35f2c1" fill-opacity=".9"/>
    <rect x="222" y="86" width="91" height="4" rx="2" fill="#6d879b" fill-opacity=".75"/>
    <rect x="222" y="97" width="69" height="4" rx="2" fill="#6d879b" fill-opacity=".5"/>
    <rect x="222" y="111" width="81" height="4" rx="2" fill="#35f2c1" fill-opacity=".55"/>
    <rect x="222" y="122" width="43" height="4" rx="2" fill="#6d879b" fill-opacity=".5"/>
    <g transform="translate(326 77)">
      <circle cx="22" cy="22" r="25" fill="#ff5364" fill-opacity=".08" stroke="#ff5364" stroke-opacity=".6"/>
      <path d="M22 7L36 13V23C36 32 30 38 22 42C14 38 8 32 8 23V13L22 7Z" fill="#ff5364" fill-opacity=".12" stroke="#ff7a86" stroke-width="1.5"/>
      <path d="M17 18L27 28M27 18L17 28" stroke="#ff9aa3" stroke-width="2.5"/>
    </g>
  </g>
  <path d="M295 148V161H268M295 161H325" stroke="#35536a" stroke-width="1.4"/>
  <circle cx="268" cy="161" r="2.5" fill="#35f2c1"/><circle cx="325" cy="161" r="2.5" fill="#35f2c1"/>

  <!-- Small circuit nodes -->
  <g fill="#35f2c1">
    <circle cx="195" cy="27" r="2"/><circle cx="191" cy="165" r="2"/>
    <circle cx="399" cy="66" r="2"/><circle cx="31" cy="88" r="2"/>
  </g>
</svg>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="row">
      <input id="q" type="search" placeholder="⌕  Search headlines and summaries" aria-label="Search">
      <button class="pill" data-region="" aria-pressed="true">All regions</button>
      <button class="pill" data-region="Bangladesh" aria-pressed="false">Bangladesh</button>
      <button class="pill" data-region="Global" aria-pressed="false">Global</button>
    </div>
    <div class="row">
      <select id="category" aria-label="Category">
        <option value="">All categories</option>
        <option>AI</option><option>Vulnerability</option><option>Cyberattack</option>
        <option>Malware/Ransomware</option><option>Data Breach</option>
        <option>Patch Tuesday</option><option>Technology</option>
        <option>Policy</option><option>Other</option>
      </select>
      <select id="days" aria-label="Date range">
        <option value="2">Today and yesterday</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
      <select id="sort" aria-label="Sort order">
        <option value="date">Newest first</option>
        <option value="severity">Highest severity first</option>
      </select>
    </div>
    <div class="row"><div class="sevbar intro" id="sevbar"></div></div>
  </div>
</div>

<main class="wrap" id="list" aria-live="polite"></main>

<script>
const $ = id => document.getElementById(id);
const SEV = ["Critical", "High", "Medium", "Low"];
const TZ = "Asia/Dhaka";
const state = { region: "", severity: "" };
let items = [];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;   // textContent keeps article text from injecting HTML
  if (cls) e.className = cls;
  return e;
}

const dayKey = d => d.toLocaleDateString("en-CA", { timeZone: TZ });
function dayLabel(key) {
  const now = new Date();
  if (key === dayKey(now)) return "Today";
  if (key === dayKey(new Date(now - 864e5))) return "Yesterday";
  return new Date(key + "T12:00:00Z").toLocaleDateString("en-GB",
    { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
const timeOf = iso => new Date(iso).toLocaleTimeString("en-GB",
  { timeZone: TZ, hour: "2-digit", minute: "2-digit" });

function card(a) {
  const sev = SEV.includes(a.severity) ? a.severity : "Medium";
  const c = el("article", "", "card " + sev);
  const tags = el("div", "", "tags");
  tags.append(el("span", sev, "sev"), el("span", a.category || "Other", "tag"));
  if (a.region === "Bangladesh") tags.append(el("span", "Bangladesh", "tag bd"));
  const h = el("h3");
  const link = el("a", a.title);
  link.href = a.url; link.target = "_blank"; link.rel = "noopener";
  h.append(link);
  const ul = el("ul");
  (a.bullets || []).forEach(b => ul.append(el("li", b)));
  const meta = el("p", "", "meta");
  meta.append(el("strong", a.source), el("span", timeOf(a.published_at) + " Dhaka time"));
  c.append(tags, h, ul, meta);
  return c;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const base = items.filter(a =>
    !q || (a.title + " " + (a.bullets || []).join(" ")).toLowerCase().includes(q));

  // severity counts (always reflect the other filters, so the bar stays useful)
  const bar = $("sevbar");
  bar.replaceChildren();
  SEV.forEach(s => {
    const n = base.filter(a => a.severity === s).length;
    const b = el("button", s, "seg " + s);
    b.append(el("b", String(n)));
    b.setAttribute("aria-pressed", state.severity === s);
    b.onclick = () => { state.severity = state.severity === s ? "" : s; render(); };
    bar.append(b);
  });

  const list = base.filter(a => !state.severity || a.severity === state.severity);
  const out = $("list");
  out.replaceChildren();

  if (!list.length) {
    const n = el("div", "", "note");
    n.append(el("strong", "No news matches these filters"),
      el("span", "Try a wider date range, or run python run_all.py to collect fresh articles."));
    out.append(n);
    return;
  }

  // official advisories pinned at the top
  const cirt = list.filter(a => a.source === "BGD e-GOV CIRT").slice(0, 3);
  if (cirt.length) {
    const p = el("section", "", "pinned");
    p.append(el("h2", "BGD e-GOV CIRT advisories"),
      el("p", "Official advisories from Bangladesh’s national CIRT", "sub"));
    cirt.forEach(a => p.append(card(a)));
    out.append(p);
  }
  const rest = list.filter(a => !cirt.includes(a));

  if ($("sort").value === "severity") {
    out.append(el("div", "Highest severity first", "day"));
    rest.forEach(a => out.append(card(a)));
  } else {
    let last = "";
    rest.forEach(a => {
      const k = dayKey(new Date(a.published_at));
      if (k !== last) { out.append(el("div", dayLabel(k), "day")); last = k; }
      out.append(card(a));
    });
  }
  if (window.lucide) lucide.createIcons();
}

async function load() {
  const params = new URLSearchParams();
  if (state.region) params.set("region", state.region);
  for (const id of ["category", "days", "sort"]) {
    const v = $(id).value;
    if (v) params.set(id, v);
  }
  const out = $("list");
  out.replaceChildren(el("div", "Loading news…", "note"));
  try {
    const res = await fetch("/api/articles?" + params);
    if (!res.ok) throw new Error("Server returned " + res.status);
    items = await res.json();
    $("updated").textContent = "Updated " + timeOf(new Date().toISOString()) + " Dhaka time";
    render();
  } catch (err) {
    const n = el("div", "", "note");
    n.append(el("strong", "Can’t load the news"),
      el("span", "Check that the server is running (uvicorn main:app --reload), then refresh."));
    out.replaceChildren(n);
  }
}

document.querySelectorAll(".pill").forEach(p => p.onclick = () => {
  document.querySelectorAll(".pill").forEach(x => x.setAttribute("aria-pressed", x === p));
  state.region = p.dataset.region;
  load();
});
["category", "days", "sort"].forEach(id => $(id).addEventListener("change", load));
$("q").addEventListener("input", render);
$("today").textContent = new Date().toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: TZ });
load();
</script>
</body>
</html>
